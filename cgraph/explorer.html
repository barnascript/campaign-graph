<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign Graph Explorer</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f4f2; --surface: #fcfcfb; --surface-2: #f0efec; --border: #dddcd7;
  --text: #0b0b0b; --text-2: #52514e; --muted: #7a7974; --accent: #2a78d6;
  --edge: #b9b8b2; --edge-hi: #0b0b0b; --good: #0a8a0a; --bad: #c43c3b;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #6250d6; --s8: #e34948; --other: #9a9994;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #383835;
    --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86; --accent: #3987e5;
    --edge: #55544f; --edge-hi: #f0efec; --good: #3fbf3f; --bad: #e66767;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #77766f;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #383835;
  --text: #f0efec; --text-2: #c3c2b7; --muted: #8f8e86; --accent: #3987e5;
  --edge: #55544f; --edge-hi: #f0efec; --good: #3fbf3f; --bad: #e66767;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #77766f;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { display: flex; flex-direction: column; background: var(--bg); color: var(--text); font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
button, select, input { font: inherit; color: inherit; }
header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
header h1 { font-size: 16px; margin: 0; letter-spacing: -0.01em; }
.stats { display: flex; flex-wrap: wrap; gap: 4px 16px; color: var(--text-2); font-size: 13px; }
.stats b { color: var(--text); font-variant-numeric: tabular-nums; }
.spacer { flex: 1; }
.tabs { display: flex; gap: 4px; }
.tab { border: 1px solid var(--border); background: transparent; padding: 5px 12px; border-radius: 6px; cursor: pointer; color: var(--text-2); }
.tab[aria-selected="true"] { background: var(--text); color: var(--surface); border-color: var(--text); }
select, input[type="search"], input[type="number"] { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 5px 8px; min-width: 0; }
main { flex: 1; min-height: 0; }
.explore { display: grid; grid-template-columns: 320px 1fr 340px; grid-template-rows: minmax(0, 1fr); height: 100%; }
.explore[hidden], .scores[hidden] { display: none; }
.panel { background: var(--surface); border-right: 1px solid var(--border); overflow: auto; min-height: 0; }
.panel:last-child { border-right: 0; border-left: 1px solid var(--border); }
.filters { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 12px; background: var(--surface); border-bottom: 1px solid var(--border); }
.filters .full { grid-column: 1 / -1; }
.filters label { display: grid; gap: 3px; font-size: 12px; color: var(--muted); }
.count { font-size: 12px; color: var(--muted); padding: 8px 12px 0; }
.list { list-style: none; margin: 0; padding: 6px; }
.item { display: grid; gap: 4px; padding: 9px 10px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.item:hover { background: var(--surface-2); }
.item[aria-current="true"] { border-color: var(--accent); background: var(--surface-2); }
.item .top { display: flex; justify-content: space-between; gap: 8px; }
.item .id { font-weight: 600; }
.item .size { color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 13px; }
.item .why { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--text-2); background: var(--surface-2); border-radius: 99px; padding: 1px 8px 1px 6px; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
.dot.hollow { background: transparent !important; border: 2px solid var(--other); }
.stage { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stage-head { padding: 12px 16px; border-bottom: 1px solid var(--border); background: var(--surface); }
.stage-head h2 { margin: 0 0 4px; font-size: 16px; }
.stage-head p { margin: 0; color: var(--text-2); font-size: 13px; }
svg.graph { flex: 1; width: 100%; min-height: 320px; display: block; touch-action: none; }
.graph line { stroke: var(--edge); stroke-linecap: round; cursor: pointer; }
.graph line.hi { stroke: var(--edge-hi); }
.graph line.hit { stroke: transparent; stroke-width: 14px; }
.graph circle { stroke: var(--surface); stroke-width: 2px; cursor: grab; }
.graph circle.sel { stroke: var(--text); stroke-width: 3px; }
.graph text { font-size: 11px; fill: var(--text-2); pointer-events: none; paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 16px; border-top: 1px solid var(--border); background: var(--surface); font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--surface); font-size: 12px; padding: 5px 8px; border-radius: 6px; max-width: 320px; opacity: 0; transition: opacity .1s; }
.detail { padding: 14px 16px; }
.detail h3 { font-size: 13px; margin: 18px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.detail h3:first-child { margin-top: 0; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 4px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.pivots { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.pivots li { display: flex; justify-content: space-between; gap: 10px; overflow-wrap: anywhere; }
.pivots .w { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.empty { color: var(--muted); }
.kind { display: inline-block; font-size: 11px; border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-right: 6px; color: var(--text-2); }
.kind.strong { border-color: var(--accent); color: var(--accent); }
.scores { max-width: 1100px; margin: 0 auto; padding: 20px 16px 40px; overflow: auto; height: 100%; }
.scores h2 { font-size: 18px; margin: 4px 0; }
.scores h3 { font-size: 15px; margin: 28px 0 8px; }
.scores p.note { color: var(--text-2); margin: 4px 0 12px; max-width: 75ch; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 8px 12px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
tr:last-child td { border-bottom: 0; }
tr.ours td { font-weight: 600; }
td.best { color: var(--good); }
td.worst { color: var(--bad); }
a.jump { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 1100px) {
  body { display: block; height: auto; }
  .explore { grid-template-columns: 260px 1fr; grid-template-rows: 75vh auto; height: auto; }
  .explore .panel:last-child { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--border); }
  .scores { height: auto; }
}
@media (max-width: 720px) {
  .explore { display: block; }
  .panel { border-right: 0; }
  .explore > .panel:first-child { max-height: 50vh; }
  .stage { height: 70vh; }
  .cols { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header>
  <h1>Campaign Graph Explorer</h1>
  <div class="stats" id="stats"></div>
  <div class="spacer"></div>
  <nav class="stats" id="links"></nav>
  <label class="stats">Ground truth <select id="truth"></select></label>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" data-view="explore" aria-selected="true">Explore</button>
    <button class="tab" role="tab" data-view="scores" aria-selected="false">Scores</button>
  </div>
</header>
<main>
  <section class="explore" id="view-explore">
    <aside class="panel">
      <div class="filters">
        <label class="full">Search host, IP, pivot or label
          <input type="search" id="q" placeholder="e.g. 154.12.86 or /api/x">
        </label>
        <label>Show
          <select id="show">
            <option value="all">All clusters</option>
            <option value="leads">Leads (unlabelled)</option>
            <option value="mixed">Mixed labels</option>
          </select>
        </label>
        <label>Min size <input type="number" id="min" min="2" value="2"></label>
        <label class="full">Label <select id="label"><option value="">Any label</option></select></label>
      </div>
      <div class="count" id="count"></div>
      <ul class="list" id="list"></ul>
    </aside>
    <section class="stage">
      <div class="stage-head" id="head"></div>
      <svg class="graph" id="graph" role="img" aria-label="Cluster graph"></svg>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip"></div>
    </section>
    <aside class="panel"><div class="detail" id="detail"></div></aside>
  </section>
  <section class="scores" id="view-scores" hidden></section>
</main>
<script>
const DATA = /*DATA*/null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d = 1) => (100 * x).toFixed(d) + "%";
const fix = (x) => x.toFixed(3);
const STRONG = new Set(["ip", "regdom", "path"]);
const byId = new Map(DATA.clusters.map((c) => [c.id, c]));
const slot = new Map(DATA.palette.map((l, i) => [l, `var(--s${i + 1})`]));
const labelOf = (n) => n.act || n.fam || null;
const colorOf = (lab) => (lab ? slot.get(lab) || "var(--other)" : null);
// fill colour comes from the colouring label only; any other label is grey
const nodeColor = (n) => colorOf(n[DATA.colorBy]) || (labelOf(n) ? "var(--other)" : null);
let state = { cid: null, node: null, edge: null, truth: 0 };

// ---------- header ----------
const m = DATA.meta;
$("stats").innerHTML = [
  ["observations", m.observations], ["hosts", m.hosts], ["edges", m.edges],
  ["clusters", m.clusters], ["clustered hosts", m.clustered],
].map(([k, v]) => `<span><b>${v.toLocaleString()}</b> ${k}</span>`).join("") +
  `<span>${esc(m.method)} · ${esc(m.generated)}</span>`;
$("links").innerHTML = (DATA.links || []).map((l) => `<a class="jump" href="${esc(l.url)}">${esc(l.label)}</a>`).join("");
$("truth").innerHTML = DATA.truths.map((t, i) => `<option value="${i}">${esc(t.name)}</option>`).join("");
const labels = [...new Set(DATA.nodes.map(labelOf).filter(Boolean))].sort();
$("label").innerHTML += labels.map((l) => `<option>${esc(l)}</option>`).join("");

// ---------- cluster list ----------
const leadSet = new Set(DATA.leads);
function matches(c, q) {
  if (!q) return true;
  return c.n.some((i) => {
    const n = DATA.nodes[i];
    return n.h.includes(q) || n.ips.some((x) => x.includes(q)) ||
      n.feats.some((f) => f.toLowerCase().includes(q)) || (labelOf(n) || "").toLowerCase().includes(q);
  }) || c.id.toLowerCase().includes(q);
}
function filtered() {
  const q = $("q").value.trim().toLowerCase(), show = $("show").value;
  const min = +$("min").value || 2, lab = $("label").value;
  return DATA.clusters.filter((c) =>
    c.n.length >= min &&
    (show !== "leads" || leadSet.has(c.id)) &&
    (show !== "mixed" || c.labs.filter(([l]) => l !== "unlabelled").length > 1) &&
    (!lab || c.labs.some(([l]) => l === lab)) && matches(c, q));
}
function chip(lab, n) {
  const col = lab === "unlabelled" ? null : colorOf(lab);
  return `<span class="chip"><span class="dot${col ? "" : " hollow"}" style="${col ? `background:${col}` : ""}"></span>${esc(lab)}${n ? ` ${n}` : ""}</span>`;
}
function renderList() {
  const cs = filtered();
  if (state.cid && !cs.some((c) => c.id === state.cid) && cs.length) select(cs[0].id);
  $("count").textContent = `${cs.length.toLocaleString()} of ${DATA.clusters.length.toLocaleString()} clusters`;
  $("list").innerHTML = cs.slice(0, 400).map((c) => `
    <li class="item" data-id="${c.id}" aria-current="${c.id === state.cid}">
      <div class="top"><span class="id">${c.id}</span><span class="size">${c.n.length} hosts</span></div>
      <div class="chips">${c.labs.slice(0, 3).map(([l, n]) => chip(l, n)).join("")}</div>
      <div class="why mono">${esc(c.ev.slice(0, 2).map(([f]) => f).join(" · "))}</div>
    </li>`).join("") + (cs.length > 400 ? `<li class="count">Showing the first 400. Narrow the filters to see more.</li>` : "");
}
$("list").addEventListener("click", (e) => {
  const li = e.target.closest(".item");
  if (!li) return;
  select(li.dataset.id);
  if (innerWidth <= 720) $("head").scrollIntoView({ behavior: "smooth" });  // graph sits below the list on phones
});
for (const id of ["q", "show", "min", "label"]) $(id).addEventListener("input", renderList);

// ---------- graph ----------
const SVGNS = "http://www.w3.org/2000/svg";
let sim = null;
function layout(c) {
  const N = c.n.length, W = 800, H = 560;
  const pos = c.n.map((_, k) => ({ x: W / 2 + 200 * Math.cos(2 * Math.PI * k / N), y: H / 2 + 200 * Math.sin(2 * Math.PI * k / N), vx: 0, vy: 0 }));
  const L = Math.max(60, 260 / Math.sqrt(N));
  for (let it = 0; it < 400; it++) {
    const cool = 1 - it / 400;
    for (let a = 0; a < N; a++) for (let b = a + 1; b < N; b++) {
      let dx = pos[b].x - pos[a].x, dy = pos[b].y - pos[a].y, d2 = dx * dx + dy * dy + 0.01;
      const f = (L * L) / d2, d = Math.sqrt(d2);
      dx /= d; dy /= d;
      pos[a].vx -= dx * f; pos[a].vy -= dy * f; pos[b].vx += dx * f; pos[b].vy += dy * f;
    }
    for (const [a, b] of c.e.map(([i, j]) => [c.n.indexOf(i), c.n.indexOf(j)])) {
      const dx = pos[b].x - pos[a].x, dy = pos[b].y - pos[a].y, d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      const f = (d - L) / d * 0.08;
      pos[a].vx += dx * f; pos[a].vy += dy * f; pos[b].vx -= dx * f; pos[b].vy -= dy * f;
    }
    for (const p of pos) {
      p.vx += (W / 2 - p.x) * 0.01; p.vy += (H / 2 - p.y) * 0.01;
      const v = Math.hypot(p.vx, p.vy), cap = 30 * cool + 1;
      if (v > cap) { p.vx *= cap / v; p.vy *= cap / v; }
      p.x += p.vx; p.y += p.vy; p.vx *= 0.5; p.vy *= 0.5;
    }
  }
  return pos;
}
function fit(pos) {
  const pad = 60, xs = pos.map((p) => p.x), ys = pos.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  const w = Math.max(...xs) - x0 + pad, h = Math.max(...ys) - y0 + pad;
  $("graph").setAttribute("viewBox", `${x0} ${y0} ${Math.max(w, 200)} ${Math.max(h, 200)}`);
}
function drawGraph(c) {
  const svg = $("graph");
  svg.innerHTML = "";
  const pos = layout(c);
  sim = { c, pos };
  fit(pos);
  const local = new Map(c.n.map((g, k) => [g, k]));
  const maxW = Math.max(...c.e.map((e) => e[2]), 1);
  const gE = document.createElementNS(SVGNS, "g"), gN = document.createElementNS(SVGNS, "g");
  svg.append(gE, gN);
  c.e.forEach((e, k) => {
    for (const hit of [false, true]) {
      const ln = document.createElementNS(SVGNS, "line");
      ln.dataset.e = k;
      if (hit) ln.classList.add("hit"); else ln.setAttribute("stroke-width", (1 + 3 * e[2] / maxW).toFixed(1));
      ln.addEventListener("click", (ev) => { ev.stopPropagation(); state.edge = k; state.node = null; paint(); renderDetail(); });
      ln.addEventListener("pointermove", (ev) => tip(ev, `${esc(DATA.nodes[e[0]].h)} ↔ ${esc(DATA.nodes[e[1]].h)}<br>${e[3].length} shared pivot${e[3].length > 1 ? "s" : ""} · weight ${e[2]}`));
      ln.addEventListener("pointerleave", untip);
      gE.append(ln);
    }
  });
  const showText = c.n.length <= 14;
  c.n.forEach((g, k) => {
    const n = DATA.nodes[g], col = nodeColor(n);
    const cir = document.createElementNS(SVGNS, "circle");
    cir.setAttribute("r", 9);
    cir.dataset.k = k;
    if (col) cir.style.fill = col; else { cir.style.fill = "var(--surface)"; cir.style.stroke = "var(--other)"; cir.style.strokeWidth = "2.5px"; }
    cir.addEventListener("pointerdown", (ev) => drag(ev, k));
    cir.addEventListener("click", (ev) => { ev.stopPropagation(); state.node = g; state.edge = null; paint(); renderDetail(); });
    cir.addEventListener("pointermove", (ev) => tip(ev, `<b>${esc(n.h)}</b><br>${esc(labelOf(n) || "unlabelled")}`));
    cir.addEventListener("pointerleave", untip);
    gN.append(cir);
    if (showText) {
      const t = document.createElementNS(SVGNS, "text");
      t.dataset.k = k; t.textContent = n.h.length > 30 ? n.h.slice(0, 28) + "…" : n.h;
      gN.append(t);
    }
  });
  svg.onclick = () => { state.node = null; state.edge = null; paint(); renderDetail(); };
  place();
  paint();
}
function place() {
  const { c, pos } = sim, local = new Map(c.n.map((g, k) => [g, k]));
  for (const ln of $("graph").querySelectorAll("line")) {
    const e = c.e[ln.dataset.e], a = pos[local.get(e[0])], b = pos[local.get(e[1])];
    ln.setAttribute("x1", a.x); ln.setAttribute("y1", a.y); ln.setAttribute("x2", b.x); ln.setAttribute("y2", b.y);
  }
  for (const el of $("graph").querySelectorAll("circle")) { const p = pos[el.dataset.k]; el.setAttribute("cx", p.x); el.setAttribute("cy", p.y); }
  for (const el of $("graph").querySelectorAll("text")) { const p = pos[el.dataset.k]; el.setAttribute("x", p.x + 13); el.setAttribute("y", p.y + 4); }
}
function paint() {
  if (!sim) return;
  const { c } = sim;
  for (const el of $("graph").querySelectorAll("circle")) el.classList.toggle("sel", c.n[el.dataset.k] === state.node);
  for (const ln of $("graph").querySelectorAll("line:not(.hit)")) {
    const e = c.e[ln.dataset.e];
    ln.classList.toggle("hi", +ln.dataset.e === state.edge || e[0] === state.node || e[1] === state.node);
  }
}
function drag(ev, k) {
  ev.preventDefault();
  const svg = $("graph"), pt = svg.createSVGPoint();
  const move = (e) => {
    pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    sim.pos[k].x = p.x; sim.pos[k].y = p.y; place();
  };
  const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
}
function tip(ev, html) {
  const t = $("tip"), r = t.parentElement.getBoundingClientRect();
  t.innerHTML = html; t.style.opacity = 1;
  const x = Math.min(ev.clientX - r.left + 14, r.width - t.offsetWidth - 8);
  t.style.left = x + "px"; t.style.top = (ev.clientY - r.top + 14) + "px";
}
function untip() { $("tip").style.opacity = 0; }

// ---------- selection + detail ----------
function select(id) {
  const c = byId.get(id);
  if (!c) return;
  state.cid = id; state.node = null; state.edge = null;
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  for (const li of $("list").querySelectorAll(".item")) li.setAttribute("aria-current", li.dataset.id === id);
  const real = c.labs.filter(([l]) => l !== "unlabelled");
  $("head").innerHTML = `<h2>${c.id} · ${c.n.length} hosts</h2>
    <p>${c.e.length} links · density ${c.d} · ${real.length ? real.map(([l, n]) => `${esc(l)} ${n}`).join(", ") : "no label: a lead"}</p>`;
  const present = [...new Set(c.n.map((g) => labelOf(DATA.nodes[g])))];
  const swatch = (col) => `<span class="dot${col ? "" : " hollow"}" style="${col ? `background:${col}` : ""}"></span>`;
  const otherNote = DATA.colorBy === "act" ? "family label only" : "other family";
  const named = present.filter((l) => l && slot.has(l));
  $("legend").innerHTML = named.map((l) => `<span>${swatch(slot.get(l))}${esc(l)}</span>`).join("") +
    (present.some((l) => l && !slot.has(l)) ? `<span>${swatch("var(--other)")}${otherNote}</span>` : "") +
    (present.includes(null) ? `<span>${swatch(null)}unlabelled</span>` : "") +
    `<span class="empty">Edge width = evidence weight. Drag nodes; click a node or edge for its pivots.</span>`;
  drawGraph(c);
  renderDetail();
}
function feat(f) {
  const [k, v] = [f.slice(0, f.indexOf(":")), f.slice(f.indexOf(":") + 1)];
  return `<span class="kind${STRONG.has(k) ? " strong" : ""}">${esc(k)}</span><span class="mono">${esc(v)}</span>`;
}
function kv(rows) {
  return `<dl class="kv">${rows.filter(([, v]) => v !== null && v !== undefined && v !== "" && !(Array.isArray(v) && !v.length))
    .map(([k, v]) => `<dt>${k}</dt><dd>${Array.isArray(v) ? v.map((x) => `<span class="mono">${esc(x)}</span>`).join("<br>") : esc(v)}</dd>`).join("")}</dl>`;
}
function renderDetail() {
  const c = byId.get(state.cid), d = $("detail");
  if (!c) { d.innerHTML = `<p class="empty">Pick a cluster.</p>`; return; }
  if (state.edge !== null) {
    const e = c.e[state.edge];
    d.innerHTML = `<h3>Link</h3>${kv([["from", DATA.nodes[e[0]].h], ["to", DATA.nodes[e[1]].h], ["weight", e[2]]])}
      <h3>Shared pivots</h3><ul class="pivots">${e[3].map((f) => `<li><span>${feat(f)}</span></li>`).join("")}</ul>
      <p class="empty">Blue tags are strong pivots: one is enough to link. Weak pivots must corroborate each other.</p>`;
    return;
  }
  if (state.node !== null) {
    const n = DATA.nodes[state.node];
    d.innerHTML = `<h3>Host</h3>${kv([["host", n.h], ["actor", n.act], ["family", n.fam], ["first seen", n.seen],
        ["ASN", n.asn ? `AS${n.asn} ${n.asnName || ""}` : null], ["IPs", n.ips], ["ports", n.ports.map(String)],
        ["URI paths", n.paths], ["sources", n.src.join(", ")]])}
      <h3>IOCs</h3>${n.iocs.length ? `<ul class="pivots">${n.iocs.map((x) => `<li class="mono">${esc(x)}</li>`).join("")}</ul>` : `<p class="empty">none</p>`}
      <h3>Pivots</h3><ul class="pivots">${n.feats.map((f) => `<li><span>${feat(f)}</span></li>`).join("")}</ul>`;
    return;
  }
  d.innerHTML = `<h3>Why these hosts are together</h3>
    <ul class="pivots">${c.ev.map(([f, k]) => `<li><span>${feat(f)}</span><span class="w">${k} link${k > 1 ? "s" : ""}</span></li>`).join("")}</ul>
    <h3>Labels</h3><div class="chips">${c.labs.map(([l, n]) => chip(l, n)).join("")}</div>
    <h3>Hosts</h3><ul class="pivots">${c.n.map((g) => `<li><a class="jump mono" data-node="${g}">${esc(DATA.nodes[g].h)}</a><span class="w">${esc(labelOf(DATA.nodes[g]) || "")}</span></li>`).join("")}</ul>`;
}
$("detail").addEventListener("click", (e) => {
  const a = e.target.closest("[data-node]");
  if (a) { state.node = +a.dataset.node; state.edge = null; paint(); renderDetail(); }
});

// ---------- scores ----------
function renderScores() {
  const t = DATA.truths[state.truth];
  const cols = [["pair_p", "Pair P"], ["pair_r", "Pair R"], ["b3_p", "B³ P"], ["b3_r", "B³ R"], ["b3_f1", "B³ F1"], ["ari", "ARI"], ["coverage", "In a cluster"]];
  const cont = (r) => r.cont_total ? r.cont_bad / r.cont_total : null;
  const scored = t.rows.filter((r) => r.method !== "all singletons" && cont(r) !== null).map(cont);
  const best = Math.min(...scored), worst = Math.max(...scored);
  $("view-scores").innerHTML = `
    <h2>${esc(t.name)}</h2>
    <p class="note">${t.hosts.toLocaleString()} scored hosts, ${t.labels} labels. Pairwise scores judge pairs of hosts. B³ (B-cubed) judges each host, so one huge label cannot drown a small one. <b>Open-world contamination</b> counts cluster-mates whose label conflicts, including unlabelled hosts whose feed family conflicts: lower is better.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Method</th>${cols.map(([, h]) => `<th>${h}</th>`).join("")}<th>Contamination</th></tr></thead>
      <tbody>${t.rows.map((r) => {
        const c = cont(r);
        const cls = c === null || r.method === "all singletons" ? "" : c === best ? "best" : c === worst ? "worst" : "";
        return `<tr class="${r.ours ? "ours" : ""}"><td>${esc(r.method)}</td>${cols.map(([k]) => `<td>${k === "coverage" ? pct(r[k]) : fix(r[k])}</td>`).join("")}
          <td class="${cls}">${c === null ? "–" : `${pct(c, 2)} <span class="empty">(${r.cont_bad.toLocaleString()}/${r.cont_total.toLocaleString()})</span>`}</td></tr>`;
      }).join("")}</tbody></table></div>
    <h3>Per label</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>Label</th><th>Hosts</th><th>In a cluster</th><th>Cluster purity</th><th>Largest piece</th></tr></thead>
      <tbody>${t.perLabel.map((r) => `<tr><td><a class="jump" data-label="${esc(r.label)}">${esc(r.label)}</a></td><td>${r.hosts.toLocaleString()}</td><td>${pct(r.clustered, 0)}</td><td>${r.clustered ? fix(r.purity) : "–"}</td><td>${r.largest}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="cols">
      <div><h3>Merges: one cluster, several labels</h3>
        ${t.merges.length ? `<div class="table-wrap"><table><thead><tr><th>Cluster</th><th>Hosts</th><th>Labels</th></tr></thead><tbody>
          ${t.merges.map((x) => `<tr><td><a class="jump" data-cid="${x.cid}">${x.cid}</a></td><td>${x.size}</td><td style="text-align:left;white-space:normal">${x.labs.map(([l, n]) => `${esc(l)} ${n}`).join(", ")}</td></tr>`).join("")}
        </tbody></table></div>` : `<p class="empty">None.</p>`}</div>
      <div><h3>Splits: one label, several clusters</h3>
        ${t.splits.length ? `<div class="table-wrap"><table><thead><tr><th>Label</th><th>Clusters</th><th>Hosts</th></tr></thead><tbody>
          ${t.splits.map((x) => `<tr><td><a class="jump" data-label="${esc(x.label)}">${esc(x.label)}</a></td><td>${x.clusters}</td><td>${x.hosts}</td></tr>`).join("")}
        </tbody></table></div>` : `<p class="empty">None.</p>`}</div>
    </div>`;
}
$("view-scores").addEventListener("click", (e) => {
  const a = e.target.closest("a.jump");
  if (!a) return;
  if (a.dataset.cid) { resetFilters(); view("explore"); renderList(); select(a.dataset.cid); }
  if (a.dataset.label) { resetFilters(); $("label").value = a.dataset.label; view("explore"); renderList(); const first = filtered()[0]; if (first) select(first.id); }
});
function resetFilters() { $("q").value = ""; $("show").value = "all"; $("min").value = 2; $("label").value = ""; }
$("truth").addEventListener("change", (e) => { state.truth = +e.target.value; renderScores(); });

// ---------- tabs ----------
function view(v) {
  for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", b.dataset.view === v);
  $("view-explore").hidden = v !== "explore"; $("view-scores").hidden = v !== "scores";
}
for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => view(b.dataset.view));

// ---------- start ----------
renderScores();
renderList();
const start = location.hash.slice(1);
select(byId.has(start) ? start : (DATA.leads[0] || DATA.clusters[0].id));
renderList();
</script>
</body>
</html>
