<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign Graph Explorer</title>
<style>
/* Layout: a statement hero over a full-height instrument panel, with a floating dock.
   One deliberate dark look: deep teal-black ground, aurora glow, hairlines, mono labels. */
@font-face { font-family: "Geist"; src: url("/fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
@font-face { font-family: "Geist Mono"; src: url("/fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  color-scheme: dark;
  --bg: #02090c; --surface: #051015; --surface-2: #0a1b22; --glass: rgba(10, 27, 34, 0.72);
  --border: rgba(243, 245, 244, 0.12); --border-2: rgba(243, 245, 244, 0.22);
  --text: #f3f5f4; --text-2: rgba(243, 245, 244, 0.68); --muted: rgba(243, 245, 244, 0.46); --faint: rgba(243, 245, 244, 0.28);
  --accent: #55d8d4; --mint: #8effda; --coral: #f26c53;
  --edge: rgba(243, 245, 244, 0.16); --edge-hi: #8effda; --good: #4bfaa9; --bad: #f26c53;
  /* categorical slots: the validated dark-surface palette, fixed order */
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767; --other: #6d7a7e;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --mono: "Geist Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --cta: radial-gradient(circle at 82% 135%, #4bfaa9 0, #3cb0a3 23%, #358ba0 52%, #2e669e 100%);
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body { margin: 0; color: var(--text); font: 15px/1.5 var(--sans); background:
  radial-gradient(1200px 520px at 78% -8%, rgba(85, 216, 212, 0.16), transparent 70%),
  radial-gradient(900px 480px at 8% 4%, rgba(46, 102, 158, 0.20), transparent 70%), var(--bg);
  background-repeat: no-repeat; padding-bottom: 96px; }
code, .mono { font-family: var(--mono); font-size: 12.5px; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important; } }
.label { font: 400 11px/1.4 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }

/* ---------- hero ---------- */
.hero { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 24px 40px;
  padding-block: 40px 28px; padding-left: max(20px, env(safe-area-inset-left, 0px)); padding-right: max(20px, env(safe-area-inset-right, 0px)); }
.hero h1 { margin: 0; font-weight: 400; font-size: clamp(44px, 8.2vw, 104px); line-height: 0.95; letter-spacing: -0.06em; text-wrap: balance; max-width: 13ch; }
.hero h1 .dim { color: var(--faint); }
.hero .lede { margin: 26px 0 0; font-size: clamp(17px, 1.6vw, 20px); line-height: 1.4; max-width: 46ch; }
.mark { align-self: start; border: 1px solid var(--border-2); min-width: 220px; }
.mark .name { padding: 12px 18px; font: 400 22px/1 var(--sans); letter-spacing: -0.03em; text-align: center; border-bottom: 1px solid var(--border-2); }
.mark .sub { padding: 10px 18px; text-align: center; font: 400 10px/1.5 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; }
.figures { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px 24px; padding-top: 18px; border-top: 1px solid var(--border); }
@media (max-width: 720px) { .figures { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.fig b { display: block; font: 400 clamp(24px, 2.6vw, 34px)/1.1 var(--sans); letter-spacing: -0.04em; font-variant-numeric: tabular-nums; }
.fig b.good { color: var(--mint); }
.note { grid-column: 1 / -1; margin: 0; font: 400 10.5px/1.6 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-2); }

/* ---------- dock ---------- */
.dock { position: fixed; z-index: 20; left: 50%; transform: translateX(-50%); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; align-items: center; gap: 2px; padding: 5px; border-radius: 12px; background: rgba(3, 16, 22, 0.86);
  border: 1px solid var(--border); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); max-width: calc(100vw - 24px); overflow-x: auto; }
.dock button, .dock a { font: 400 12.5px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; color: var(--text);
  background: transparent; border: 0; border-radius: 8px; padding: 11px 14px; cursor: pointer; text-decoration: none; }
.dock .tab[aria-selected="true"] { background: rgba(243, 245, 244, 0.09); }
.dock button:hover, .dock a:hover { background: rgba(243, 245, 244, 0.06); }
.dock .cta { background: var(--cta); color: #02090c; font-weight: 500; }
.dock .cta:hover { filter: brightness(1.08); background: var(--cta); }

/* ---------- controls ---------- */
select, input[type="search"], input[type="number"] { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; min-width: 0; color: var(--text); }
select:hover, input:hover { border-color: var(--border-2); }

/* ---------- explorer ---------- */
main { padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); }
.explore { display: grid; grid-template-columns: 320px minmax(0, 1fr) 340px; grid-template-rows: minmax(0, 1fr); height: calc(100vh - 120px); min-height: 560px;
  border: 1px solid var(--border); border-radius: 14px; overflow: hidden; background: var(--glass); }
.explore[hidden], .scores[hidden] { display: none; }
.panel { background: transparent; border-right: 1px solid var(--border); overflow: auto; min-height: 0; }
.panel:last-child { border-right: 0; border-left: 1px solid var(--border); }
.filters { position: sticky; top: 0; z-index: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 14px; background: rgba(5, 16, 21, 0.96); border-bottom: 1px solid var(--border); }
.filters .full { grid-column: 1 / -1; }
.filters label { display: grid; gap: 5px; font: 400 10.5px/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
.filters input, .filters select { font: 14px var(--sans); text-transform: none; letter-spacing: 0; }
.count { font: 400 10.5px/1 var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); padding: 12px 14px 2px; }
.list { list-style: none; margin: 0; padding: 6px; }
.item { display: grid; gap: 5px; padding: 10px 11px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
.item:hover { background: rgba(243, 245, 244, 0.04); }
.item[aria-current="true"] { border-color: rgba(85, 216, 212, 0.55); background: rgba(85, 216, 212, 0.07); }
.item .top { display: flex; justify-content: space-between; gap: 8px; }
.item .id { font: 500 13px var(--mono); letter-spacing: 0.02em; }
.item .size { color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 13px; }
.item .why { color: var(--muted); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); border: 1px solid var(--border); border-radius: 99px; padding: 1px 9px 1px 7px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
.dot.hollow { background: transparent !important; border: 1.5px solid var(--text-2); }
.stage { position: relative; display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.stage-head { padding: 14px 18px; border-bottom: 1px solid var(--border); }
.stage-head h2 { margin: 0 0 4px; font: 400 22px/1.15 var(--sans); letter-spacing: -0.035em; }
.stage-head p { margin: 0; color: var(--text-2); font-size: 13px; }
svg.graph { flex: 1; width: 100%; min-height: 320px; display: block; touch-action: none;
  background: radial-gradient(circle at 50% 45%, rgba(85, 216, 212, 0.07), transparent 62%); }
.graph line { stroke: var(--edge); stroke-linecap: round; cursor: pointer; }
.graph line.hi { stroke: var(--edge-hi); }
.graph line.hit { stroke: transparent; stroke-width: 14px; }
.graph circle { stroke: var(--bg); stroke-width: 2px; cursor: grab; }
.graph circle.sel { stroke: var(--mint); stroke-width: 3px; filter: drop-shadow(0 0 6px rgba(142, 255, 218, 0.7)); }
.graph text { font: 11px var(--mono); fill: var(--text-2); pointer-events: none; paint-order: stroke; stroke: var(--bg); stroke-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; padding: 10px 18px; border-top: 1px solid var(--border); font-size: 12px; color: var(--text-2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12px; padding: 6px 9px; border-radius: 7px; max-width: 320px; opacity: 0; transition: opacity .1s; }
.detail { padding: 16px 18px; }
.detail h3 { font: 400 10.5px/1.3 var(--mono); margin: 22px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.detail h3:first-child { margin-top: 0; }
.kv { display: grid; grid-template-columns: 90px 1fr; gap: 5px 10px; font-size: 13px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; overflow-wrap: anywhere; }
.pivots { list-style: none; padding: 0; margin: 0; display: grid; gap: 5px; }
.pivots li { display: flex; justify-content: space-between; gap: 10px; overflow-wrap: anywhere; }
.pivots .w { color: var(--muted); font-variant-numeric: tabular-nums; flex: none; }
.empty { color: var(--muted); }
.kind { display: inline-block; font: 400 10.5px/1.5 var(--mono); border: 1px solid var(--border-2); border-radius: 4px; padding: 0 5px; margin-right: 7px; color: var(--text-2); text-transform: uppercase; letter-spacing: .04em; }
.kind.strong { border-color: rgba(85, 216, 212, 0.7); color: var(--accent); }

/* ---------- scores ---------- */
.scores { max-width: 1120px; margin: 0 auto; padding: 8px 8px 40px; }
.scores-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; padding: 14px 0; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
.scores h2 { font: 400 clamp(28px, 3.4vw, 42px)/1.05 var(--sans); letter-spacing: -0.05em; margin: 6px 0 8px; }
.scores h3 { font: 400 10.5px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 32px 0 10px; }
.scores p.note2 { color: var(--text-2); margin: 4px 0 16px; max-width: 75ch; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; background: var(--glass); }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font: 400 10.5px/1.3 var(--mono); text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
tr.ours td { color: var(--text); font-weight: 500; background: rgba(85, 216, 212, 0.05); }
td.best { color: var(--mint); }
td.worst { color: var(--coral); }
a.jump { color: var(--accent); cursor: pointer; text-decoration: underline; text-decoration-color: rgba(85, 216, 212, 0.4); text-underline-offset: 3px; }
a.jump:hover { text-decoration-color: var(--accent); }
.cols { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }

@media (max-width: 1100px) {
  .explore { grid-template-columns: 260px minmax(0, 1fr); grid-template-rows: 72vh auto; height: auto; }
  .explore .panel:last-child { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--border); }
}
@media (max-width: 720px) {
  .hero { grid-template-columns: 1fr; padding-top: 28px; }
  .mark { order: -1; justify-self: start; min-width: 0; }
  .explore { display: block; }
  .panel { border-right: 0; }
  .explore > .panel:first-child { max-height: 50vh; border-bottom: 1px solid var(--border); }
  .stage { height: 70vh; }
  .cols { grid-template-columns: 1fr; }
  .dock button, .dock a { padding: 10px 8px; font-size: 10.5px; letter-spacing: 0; }
  .hide-sm { display: none; }
}
</style>
</head>
<body>
<header class="hero">
  <div>
    <h1>Which attacks share an <span class="dim">attacker?</span></h1>
    <p class="lede" id="lede"></p>
  </div>
  <div class="mark" aria-label="campaign-graph">
    <div class="name">campaign-graph</div>
    <div class="sub label">C2 infrastructure clustering<br>scored against actor truth</div>
  </div>
  <div class="figures" id="figures"></div>
  <p class="note"><span id="asof"></span>Passive collection only. Nothing here touches attacker infrastructure. Indicators shown without query strings.</p>
</header>
<nav class="dock" aria-label="Sections">
  <button class="tab" data-view="explore" aria-selected="true">Explore</button>
  <button class="tab" data-view="scores" aria-selected="false">Scores</button>
  <span id="links"></span>
  <button class="cta" id="lead-cta"><span class="hide-sm">Open the </span>lead</button>
</nav>
<main>
  <section class="explore" id="view-explore">
    <aside class="panel">
      <div class="filters">
        <label class="full">Search host, IP, pivot or label
          <input type="search" id="q" placeholder="e.g. 154.12.86 or /api/x">
        </label>
        <label>Show
          <select id="show">
            <option value="all">All clusters</option>
            <option value="leads">Leads (unlabelled)</option>
            <option value="mixed">Mixed labels</option>
          </select>
        </label>
        <label>Min size <input type="number" id="min" min="2" value="2"></label>
        <label class="full">Label <select id="label"><option value="">Any label</option></select></label>
      </div>
      <div class="count" id="count"></div>
      <ul class="list" id="list"></ul>
    </aside>
    <section class="stage">
      <div class="stage-head" id="head"></div>
      <svg class="graph" id="graph" role="img" aria-label="Cluster graph"></svg>
      <div class="legend" id="legend"></div>
      <div class="tip" id="tip"></div>
    </section>
    <aside class="panel"><div class="detail" id="detail"></div></aside>
  </section>
  <section class="scores" id="view-scores" hidden>
    <div class="scores-bar"><span class="label">Ground truth</span><select id="truth"></select></div>
    <div id="scores-body"></div>
  </section>
</main>
<script>
const DATA = /*DATA*/null;
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pct = (x, d = 1) => (100 * x).toFixed(d) + "%";
const fix = (x) => x.toFixed(3);
const STRONG = new Set(["ip", "regdom", "path"]);
const byId = new Map(DATA.clusters.map((c) => [c.id, c]));
const slot = new Map(DATA.palette.map((l, i) => [l, `var(--s${i + 1})`]));
const labelOf = (n) => n.act || n.fam || null;
const colorOf = (lab) => (lab ? slot.get(lab) || "var(--other)" : null);
// fill colour comes from the colouring label only; any other label is grey
const nodeColor = (n) => colorOf(n[DATA.colorBy]) || (labelOf(n) ? "var(--other)" : null);
let state = { cid: null, node: null, edge: null, truth: 0 };

// ---------- header ----------
const m = DATA.meta;
// Headline numbers come from the first ground truth (actors when loaded): never typed in.
const t0 = DATA.truths[0], ours = t0.rows.find((r) => r.ours);
const domain = t0.rows.find((r) => r.method === "same reg. domain");
const cont = (r) => (r && r.cont_total ? r.cont_bad / r.cont_total : null);
$("lede").textContent = `Servers from public threat feeds, grouped by the evidence they share, then graded against ${
  t0.name.startsWith("Actors") ? "actor-level labels" : "feed labels"}. Click any link between two servers to see why they were joined.`;
$("figures").innerHTML = [
  [m.hosts.toLocaleString(), "servers from public feeds"],
  [m.clusters.toLocaleString(), "clusters of 2+"],
  [cont(ours) === null ? "–" : pct(cont(ours), 2), "of links wrong vs " + (t0.name.startsWith("Actors") ? "actors" : "labels"), "good"],
  [cont(domain) === null ? "–" : pct(cont(domain), 1), "for the simple domain baseline"],
].map(([v, k, cls]) => `<div class="fig"><b class="${cls || ""}">${v}</b><span class="label">${k}</span></div>`).join("");
$("asof").textContent = `Data as of ${m.generated}. `;
$("links").innerHTML = (DATA.links || []).map((l) => `<a href="${esc(l.url)}">${esc(l.label)}</a>`).join("");
$("lead-cta").addEventListener("click", () => {
  resetFilters(); view("explore"); renderList(); select(DATA.leads[0] || DATA.clusters[0].id);
  document.querySelector(".explore").scrollIntoView({ behavior: "smooth", block: "start" });
});
$("truth").innerHTML = DATA.truths.map((t, i) => `<option value="${i}">${esc(t.name)}</option>`).join("");
const labels = [...new Set(DATA.nodes.map(labelOf).filter(Boolean))].sort();
$("label").innerHTML += labels.map((l) => `<option>${esc(l)}</option>`).join("");

// ---------- cluster list ----------
const leadSet = new Set(DATA.leads);
function matches(c, q) {
  if (!q) return true;
  return c.n.some((i) => {
    const n = DATA.nodes[i];
    return n.h.includes(q) || n.ips.some((x) => x.includes(q)) ||
      n.feats.some((f) => f.toLowerCase().includes(q)) || (labelOf(n) || "").toLowerCase().includes(q);
  }) || c.id.toLowerCase().includes(q);
}
function filtered() {
  const q = $("q").value.trim().toLowerCase(), show = $("show").value;
  const min = +$("min").value || 2, lab = $("label").value;
  return DATA.clusters.filter((c) =>
    c.n.length >= min &&
    (show !== "leads" || leadSet.has(c.id)) &&
    (show !== "mixed" || c.labs.filter(([l]) => l !== "unlabelled").length > 1) &&
    (!lab || c.labs.some(([l]) => l === lab)) && matches(c, q));
}
function chip(lab, n) {
  const col = lab === "unlabelled" ? null : colorOf(lab);
  return `<span class="chip"><span class="dot${col ? "" : " hollow"}" style="${col ? `background:${col}` : ""}"></span>${esc(lab)}${n ? ` ${n}` : ""}</span>`;
}
function renderList() {
  const cs = filtered();
  if (state.cid && !cs.some((c) => c.id === state.cid) && cs.length) select(cs[0].id);
  $("count").textContent = `${cs.length.toLocaleString()} of ${DATA.clusters.length.toLocaleString()} clusters`;
  $("list").innerHTML = cs.slice(0, 400).map((c) => `
    <li class="item" data-id="${c.id}" aria-current="${c.id === state.cid}">
      <div class="top"><span class="id">${c.id}</span><span class="size">${c.n.length} hosts</span></div>
      <div class="chips">${c.labs.slice(0, 3).map(([l, n]) => chip(l, n)).join("")}</div>
      <div class="why mono">${esc(c.ev.slice(0, 2).map(([f]) => f).join(" · "))}</div>
    </li>`).join("") + (cs.length > 400 ? `<li class="count">Showing the first 400. Narrow the filters to see more.</li>` : "");
}
$("list").addEventListener("click", (e) => {
  const li = e.target.closest(".item");
  if (!li) return;
  select(li.dataset.id);
  if (innerWidth <= 720) $("head").scrollIntoView({ behavior: "smooth" });  // graph sits below the list on phones
});
for (const id of ["q", "show", "min", "label"]) $(id).addEventListener("input", renderList);

// ---------- graph ----------
const SVGNS = "http://www.w3.org/2000/svg";
let sim = null;
function layout(c) {
  const N = c.n.length, W = 800, H = 560;
  const pos = c.n.map((_, k) => ({ x: W / 2 + 200 * Math.cos(2 * Math.PI * k / N), y: H / 2 + 200 * Math.sin(2 * Math.PI * k / N), vx: 0, vy: 0 }));
  const L = Math.max(60, 260 / Math.sqrt(N));
  for (let it = 0; it < 400; it++) {
    const cool = 1 - it / 400;
    for (let a = 0; a < N; a++) for (let b = a + 1; b < N; b++) {
      let dx = pos[b].x - pos[a].x, dy = pos[b].y - pos[a].y, d2 = dx * dx + dy * dy + 0.01;
      const f = (L * L) / d2, d = Math.sqrt(d2);
      dx /= d; dy /= d;
      pos[a].vx -= dx * f; pos[a].vy -= dy * f; pos[b].vx += dx * f; pos[b].vy += dy * f;
    }
    for (const [a, b] of c.e.map(([i, j]) => [c.n.indexOf(i), c.n.indexOf(j)])) {
      const dx = pos[b].x - pos[a].x, dy = pos[b].y - pos[a].y, d = Math.sqrt(dx * dx + dy * dy) + 0.01;
      const f = (d - L) / d * 0.08;
      pos[a].vx += dx * f; pos[a].vy += dy * f; pos[b].vx -= dx * f; pos[b].vy -= dy * f;
    }
    for (const p of pos) {
      p.vx += (W / 2 - p.x) * 0.01; p.vy += (H / 2 - p.y) * 0.01;
      const v = Math.hypot(p.vx, p.vy), cap = 30 * cool + 1;
      if (v > cap) { p.vx *= cap / v; p.vy *= cap / v; }
      p.x += p.vx; p.y += p.vy; p.vx *= 0.5; p.vy *= 0.5;
    }
  }
  return pos;
}
function fit(pos) {
  const pad = 60, xs = pos.map((p) => p.x), ys = pos.map((p) => p.y);
  const x0 = Math.min(...xs) - pad, y0 = Math.min(...ys) - pad;
  const w = Math.max(...xs) - x0 + pad, h = Math.max(...ys) - y0 + pad;
  $("graph").setAttribute("viewBox", `${x0} ${y0} ${Math.max(w, 200)} ${Math.max(h, 200)}`);
}
function drawGraph(c) {
  const svg = $("graph");
  svg.innerHTML = "";
  const pos = layout(c);
  sim = { c, pos };
  fit(pos);
  const local = new Map(c.n.map((g, k) => [g, k]));
  const maxW = Math.max(...c.e.map((e) => e[2]), 1);
  const gE = document.createElementNS(SVGNS, "g"), gN = document.createElementNS(SVGNS, "g");
  svg.append(gE, gN);
  c.e.forEach((e, k) => {
    for (const hit of [false, true]) {
      const ln = document.createElementNS(SVGNS, "line");
      ln.dataset.e = k;
      if (hit) ln.classList.add("hit"); else ln.setAttribute("stroke-width", (1 + 3 * e[2] / maxW).toFixed(1));
      ln.addEventListener("click", (ev) => { ev.stopPropagation(); state.edge = k; state.node = null; paint(); renderDetail(); });
      ln.addEventListener("pointermove", (ev) => tip(ev, `${esc(DATA.nodes[e[0]].h)} ↔ ${esc(DATA.nodes[e[1]].h)}<br>${e[3].length} shared pivot${e[3].length > 1 ? "s" : ""} · weight ${e[2]}`));
      ln.addEventListener("pointerleave", untip);
      gE.append(ln);
    }
  });
  const showText = c.n.length <= 14;
  c.n.forEach((g, k) => {
    const n = DATA.nodes[g], col = nodeColor(n);
    const cir = document.createElementNS(SVGNS, "circle");
    cir.setAttribute("r", 9);
    cir.dataset.k = k;
    if (col) cir.style.fill = col; else { cir.style.fill = "var(--surface)"; cir.style.stroke = "var(--other)"; cir.style.strokeWidth = "2.5px"; }
    cir.addEventListener("pointerdown", (ev) => drag(ev, k));
    cir.addEventListener("click", (ev) => { ev.stopPropagation(); state.node = g; state.edge = null; paint(); renderDetail(); });
    cir.addEventListener("pointermove", (ev) => tip(ev, `<b>${esc(n.h)}</b><br>${esc(labelOf(n) || "unlabelled")}`));
    cir.addEventListener("pointerleave", untip);
    gN.append(cir);
    if (showText) {
      const t = document.createElementNS(SVGNS, "text");
      t.dataset.k = k; t.textContent = n.h.length > 30 ? n.h.slice(0, 28) + "…" : n.h;
      gN.append(t);
    }
  });
  svg.onclick = () => { state.node = null; state.edge = null; paint(); renderDetail(); };
  place();
  paint();
}
function place() {
  const { c, pos } = sim, local = new Map(c.n.map((g, k) => [g, k]));
  for (const ln of $("graph").querySelectorAll("line")) {
    const e = c.e[ln.dataset.e], a = pos[local.get(e[0])], b = pos[local.get(e[1])];
    ln.setAttribute("x1", a.x); ln.setAttribute("y1", a.y); ln.setAttribute("x2", b.x); ln.setAttribute("y2", b.y);
  }
  for (const el of $("graph").querySelectorAll("circle")) { const p = pos[el.dataset.k]; el.setAttribute("cx", p.x); el.setAttribute("cy", p.y); }
  for (const el of $("graph").querySelectorAll("text")) { const p = pos[el.dataset.k]; el.setAttribute("x", p.x + 13); el.setAttribute("y", p.y + 4); }
}
function paint() {
  if (!sim) return;
  const { c } = sim;
  for (const el of $("graph").querySelectorAll("circle")) el.classList.toggle("sel", c.n[el.dataset.k] === state.node);
  for (const ln of $("graph").querySelectorAll("line:not(.hit)")) {
    const e = c.e[ln.dataset.e];
    ln.classList.toggle("hi", +ln.dataset.e === state.edge || e[0] === state.node || e[1] === state.node);
  }
}
function drag(ev, k) {
  ev.preventDefault();
  const svg = $("graph"), pt = svg.createSVGPoint();
  const move = (e) => {
    pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    sim.pos[k].x = p.x; sim.pos[k].y = p.y; place();
  };
  const up = () => { window.removeEventListener("pointermove", move); window.removeEventListener("pointerup", up); };
  window.addEventListener("pointermove", move); window.addEventListener("pointerup", up);
}
function tip(ev, html) {
  const t = $("tip"), r = t.parentElement.getBoundingClientRect();
  t.innerHTML = html; t.style.opacity = 1;
  const x = Math.min(ev.clientX - r.left + 14, r.width - t.offsetWidth - 8);
  t.style.left = x + "px"; t.style.top = (ev.clientY - r.top + 14) + "px";
}
function untip() { $("tip").style.opacity = 0; }

// ---------- selection + detail ----------
function select(id) {
  const c = byId.get(id);
  if (!c) return;
  state.cid = id; state.node = null; state.edge = null;
  if (location.hash !== "#" + id) history.replaceState(null, "", "#" + id);
  for (const li of $("list").querySelectorAll(".item")) li.setAttribute("aria-current", li.dataset.id === id);
  const real = c.labs.filter(([l]) => l !== "unlabelled");
  $("head").innerHTML = `<h2>${c.id} · ${c.n.length} hosts</h2>
    <p>${c.e.length} links · density ${c.d} · ${real.length ? real.map(([l, n]) => `${esc(l)} ${n}`).join(", ") : "no label: a lead"}</p>`;
  const present = [...new Set(c.n.map((g) => labelOf(DATA.nodes[g])))];
  const swatch = (col) => `<span class="dot${col ? "" : " hollow"}" style="${col ? `background:${col}` : ""}"></span>`;
  const otherNote = DATA.colorBy === "act" ? "family label only" : "other family";
  const named = present.filter((l) => l && slot.has(l));
  $("legend").innerHTML = named.map((l) => `<span>${swatch(slot.get(l))}${esc(l)}</span>`).join("") +
    (present.some((l) => l && !slot.has(l)) ? `<span>${swatch("var(--other)")}${otherNote}</span>` : "") +
    (present.includes(null) ? `<span>${swatch(null)}unlabelled</span>` : "") +
    `<span class="empty">Edge width = evidence weight. Drag nodes; click a node or edge for its pivots.</span>`;
  drawGraph(c);
  renderDetail();
}
function feat(f) {
  const [k, v] = [f.slice(0, f.indexOf(":")), f.slice(f.indexOf(":") + 1)];
  return `<span class="kind${STRONG.has(k) ? " strong" : ""}">${esc(k)}</span><span class="mono">${esc(v)}</span>`;
}
function kv(rows) {
  return `<dl class="kv">${rows.filter(([, v]) => v !== null && v !== undefined && v !== "" && !(Array.isArray(v) && !v.length))
    .map(([k, v]) => `<dt>${k}</dt><dd>${Array.isArray(v) ? v.map((x) => `<span class="mono">${esc(x)}</span>`).join("<br>") : esc(v)}</dd>`).join("")}</dl>`;
}
function renderDetail() {
  const c = byId.get(state.cid), d = $("detail");
  if (!c) { d.innerHTML = `<p class="empty">Pick a cluster.</p>`; return; }
  if (state.edge !== null) {
    const e = c.e[state.edge];
    d.innerHTML = `<h3>Link</h3>${kv([["from", DATA.nodes[e[0]].h], ["to", DATA.nodes[e[1]].h], ["weight", e[2]]])}
      <h3>Shared pivots</h3><ul class="pivots">${e[3].map((f) => `<li><span>${feat(f)}</span></li>`).join("")}</ul>
      <p class="empty">Blue tags are strong pivots: one is enough to link. Weak pivots must corroborate each other.</p>`;
    return;
  }
  if (state.node !== null) {
    const n = DATA.nodes[state.node];
    d.innerHTML = `<h3>Host</h3>${kv([["host", n.h], ["actor", n.act], ["family", n.fam], ["first seen", n.seen],
        ["ASN", n.asn ? `AS${n.asn} ${n.asnName || ""}` : null], ["IPs", n.ips], ["ports", n.ports.map(String)],
        ["URI paths", n.paths], ["sources", n.src.join(", ")]])}
      <h3>IOCs</h3>${n.iocs.length ? `<ul class="pivots">${n.iocs.map((x) => `<li class="mono">${esc(x)}</li>`).join("")}</ul>` : `<p class="empty">none</p>`}
      <h3>Pivots</h3><ul class="pivots">${n.feats.map((f) => `<li><span>${feat(f)}</span></li>`).join("")}</ul>`;
    return;
  }
  d.innerHTML = `<h3>Why these hosts are together</h3>
    <ul class="pivots">${c.ev.map(([f, k]) => `<li><span>${feat(f)}</span><span class="w">${k} link${k > 1 ? "s" : ""}</span></li>`).join("")}</ul>
    <h3>Labels</h3><div class="chips">${c.labs.map(([l, n]) => chip(l, n)).join("")}</div>
    <h3>Hosts</h3><ul class="pivots">${c.n.map((g) => `<li><a class="jump mono" data-node="${g}">${esc(DATA.nodes[g].h)}</a><span class="w">${esc(labelOf(DATA.nodes[g]) || "")}</span></li>`).join("")}</ul>`;
}
$("detail").addEventListener("click", (e) => {
  const a = e.target.closest("[data-node]");
  if (a) { state.node = +a.dataset.node; state.edge = null; paint(); renderDetail(); }
});

// ---------- scores ----------
function renderScores() {
  const t = DATA.truths[state.truth];
  const cols = [["pair_p", "Pair P"], ["pair_r", "Pair R"], ["b3_p", "B³ P"], ["b3_r", "B³ R"], ["b3_f1", "B³ F1"], ["ari", "ARI"], ["coverage", "In a cluster"]];
  const cont = (r) => r.cont_total ? r.cont_bad / r.cont_total : null;
  const scored = t.rows.filter((r) => r.method !== "all singletons" && cont(r) !== null).map(cont);
  const best = Math.min(...scored), worst = Math.max(...scored);
  $("scores-body").innerHTML = `
    <h2>${esc(t.name)}</h2>
    <p class="note2">${t.hosts.toLocaleString()} scored hosts, ${t.labels} labels. Pairwise scores judge pairs of hosts. B³ (B-cubed) judges each host, so one huge label cannot drown a small one. <b>Open-world contamination</b> counts cluster-mates whose label conflicts, including unlabelled hosts whose feed family conflicts: lower is better.</p>
    <div class="table-wrap"><table>
      <thead><tr><th>Method</th>${cols.map(([, h]) => `<th>${h}</th>`).join("")}<th>Contamination</th></tr></thead>
      <tbody>${t.rows.map((r) => {
        const c = cont(r);
        const cls = c === null || r.method === "all singletons" ? "" : c === best ? "best" : c === worst ? "worst" : "";
        return `<tr class="${r.ours ? "ours" : ""}"><td>${esc(r.method)}</td>${cols.map(([k]) => `<td>${k === "coverage" ? pct(r[k]) : fix(r[k])}</td>`).join("")}
          <td class="${cls}">${c === null ? "–" : `${pct(c, 2)} <span class="empty">(${r.cont_bad.toLocaleString()}/${r.cont_total.toLocaleString()})</span>`}</td></tr>`;
      }).join("")}</tbody></table></div>
    <h3>Per label</h3>
    <div class="table-wrap"><table>
      <thead><tr><th>Label</th><th>Hosts</th><th>In a cluster</th><th>Cluster purity</th><th>Largest piece</th></tr></thead>
      <tbody>${t.perLabel.map((r) => `<tr><td><a class="jump" data-label="${esc(r.label)}">${esc(r.label)}</a></td><td>${r.hosts.toLocaleString()}</td><td>${pct(r.clustered, 0)}</td><td>${r.clustered ? fix(r.purity) : "–"}</td><td>${r.largest}</td></tr>`).join("")}</tbody>
    </table></div>
    <div class="cols">
      <div><h3>Merges: one cluster, several labels</h3>
        ${t.merges.length ? `<div class="table-wrap"><table><thead><tr><th>Cluster</th><th>Hosts</th><th>Labels</th></tr></thead><tbody>
          ${t.merges.map((x) => `<tr><td><a class="jump" data-cid="${x.cid}">${x.cid}</a></td><td>${x.size}</td><td style="text-align:left;white-space:normal">${x.labs.map(([l, n]) => `${esc(l)} ${n}`).join(", ")}</td></tr>`).join("")}
        </tbody></table></div>` : `<p class="empty">None.</p>`}</div>
      <div><h3>Splits: one label, several clusters</h3>
        ${t.splits.length ? `<div class="table-wrap"><table><thead><tr><th>Label</th><th>Clusters</th><th>Hosts</th></tr></thead><tbody>
          ${t.splits.map((x) => `<tr><td><a class="jump" data-label="${esc(x.label)}">${esc(x.label)}</a></td><td>${x.clusters}</td><td>${x.hosts}</td></tr>`).join("")}
        </tbody></table></div>` : `<p class="empty">None.</p>`}</div>
    </div>`;
}
$("view-scores").addEventListener("click", (e) => {
  const a = e.target.closest("a.jump");
  if (!a) return;
  if (a.dataset.cid) { resetFilters(); view("explore"); renderList(); select(a.dataset.cid); }
  if (a.dataset.label) { resetFilters(); $("label").value = a.dataset.label; view("explore"); renderList(); const first = filtered()[0]; if (first) select(first.id); }
});
function resetFilters() { $("q").value = ""; $("show").value = "all"; $("min").value = 2; $("label").value = ""; }
$("truth").addEventListener("change", (e) => { state.truth = +e.target.value; renderScores(); });

// ---------- tabs ----------
function view(v) {
  for (const b of document.querySelectorAll(".tab")) b.setAttribute("aria-selected", b.dataset.view === v);
  $("view-explore").hidden = v !== "explore"; $("view-scores").hidden = v !== "scores";
}
for (const b of document.querySelectorAll(".tab")) b.addEventListener("click", () => view(b.dataset.view));

// ---------- start ----------
renderScores();
renderList();
const start = location.hash.slice(1);
select(byId.has(start) ? start : (DATA.leads[0] || DATA.clusters[0].id));
renderList();
</script>
</body>
</html>
