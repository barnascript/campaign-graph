# Generated by build_site.py: run it again after changing the site.
services:
  - type: web
    name: campaign-graph
    runtime: static
    buildCommand: echo "site/ is prebuilt by build_site.py"
    staticPublishPath: ./site
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'sha256-OEuj4M0CBg64LxttKSo68bww7XKg5RkEAZTp62/CrxY='; style-src 'unsafe-inline'; img-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: "nosniff"
      - path: /*
        name: Referrer-Policy
        value: "no-referrer"
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(), geolocation=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000"
